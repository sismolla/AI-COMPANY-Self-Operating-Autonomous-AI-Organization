version: '3.8'

services:
  ai-company:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_company_orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://aico:company_secret@postgres:5432/ai_company
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AUTO_CYCLE_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./tools_data:/app/tools_data
      - ./workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: ai_company_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aico
      POSTGRES_PASSWORD: company_secret
      POSTGRES_DB: ai_company
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aico -d ai_company"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_company_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
